# Full local stack: `docker compose up --build`, then open http://localhost:3000.
# Values come from .env (copy .env.example); the defaults below are for local use only.
name: blog-crm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog_crm}
      POSTGRES_USER: ${POSTGRES_USER:-blog_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog_crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-blog_crm}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-blog_crm}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-blog_crm}
      # Local defaults sign you in as admin@example.com / admin. Override all three in .env for anything real.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$$2a$$10$$wBISilJqYrK8S7ddSh4zhuWUnPjn24l5hToR4l4lIkKH/WG.fsKI6}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-production-use}
      MEDIA_STORAGE_PATH: /data/media
    volumes:
      - media-data:/data/media
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
