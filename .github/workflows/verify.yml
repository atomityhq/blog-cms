name: Verify

on:
  push:
    branches: [main, feat/markdown-file-management]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle.kts
      - name: Verify Docker for PostgreSQL Testcontainers
        run: docker info
      - name: Build and run the full backend suite
        working-directory: backend
        run: ./gradlew build --no-daemon
      - name: Record full-suite results before repeating races
        working-directory: backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import xml.etree.ElementTree as ET
          results = Path('build/test-results/test')
          reports = [ET.parse(path).getroot() for path in results.glob('TEST-*.xml')]
          if not reports:
              raise SystemExit('No backend test reports were produced')
          counts = {key: sum(int(report.get(key, 0)) for report in reports)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          summary = 'Backend full suite: ' + ', '.join(f'{value} {key}' for key, value in counts.items())
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary + '\n')
          shutil.copytree(results, Path('build/test-results/full-suite'))
          PY
      - name: Repeat lifecycle races on fresh test executions
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            ./gradlew test --no-daemon --rerun-tasks --tests '*MarkdownSourceDeletionIntegrationTest' --tests '*MarkdownSourceLifecycleRaceTest'
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.16.0
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
