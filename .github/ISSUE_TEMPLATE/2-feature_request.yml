name: ✨ Feature request
description: Suggest a new feature or an improvement.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Clear problems are easier to act on than solutions alone, so start with the "why".

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: When I write a series of posts, I have no way to link them together…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Mock-ups and API sketches are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Editor
        - Posts list
        - Authors / tags
        - Media library
        - API
        - Developer experience / setup
        - Other

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
