spring:
  jpa:
    properties:
      hibernate:
        # Read by BlogQueryCountTest. Set here, not per-class, so every test shares one Spring context.
        generate_statistics: true

logging:
  level:
    # Statistics stay on for the query-budget test, but skip the per-session metrics dump at INFO.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

blogcms:
  admin:
    email: admin@test.local
    # bcrypt("test-password"), cost 4 to keep tests fast
    password-hash: "$2a$04$WKH3rfDFLX/OCGamG3yfoO2u.JR1NDKBb9khVFvP4jjFnqw2z2nE2"
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
    ttl: 1h
  media:
    nextcloud:
      url: http://localhost:9999
      username: test-user
      password: test-password
      remote-directory: /BlogCMS
