server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: blog-crm

  # No credential defaults here on purpose: production must supply them.
  # For local development run with SPRING_PROFILES_ACTIVE=local (see application-local.yml).
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      # /health/liveness  — process is up (never checks dependencies, so a DB outage
      #                     does not get the pod restarted in a loop)
      # /health/readiness — also requires the database, so traffic is held back until it answers
      group:
        readiness:
          include: readinessState, db

logging:
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","logger":"%logger{36}","correlationId":"%X{correlation_id}","msg":"%m"}%n'
